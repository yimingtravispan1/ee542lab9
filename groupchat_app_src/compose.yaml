name: ee542-lab9
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: groupchat
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u chatuser groupchat -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  llama:
    profiles: ["llm"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - type: bind
        source: ./models/Llama-3.2-3B-Instruct-Q4_K_M.gguf
        target: /models/llama3.gguf
        read_only: true
        bind:
          create_host_path: false
    command: ["-m", "/models/llama3.gguf", "--host", "0.0.0.0", "--port", "8001", "--ctx-size", "4096", "--alias", "llama-3.2-3b-instruct"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  mysql_data:
